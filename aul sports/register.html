<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Create Account - School Sports Hub</title>

    <link rel="stylesheet" href="aupl.css">
</head>

<body>

<header>

    <h1>🏆 School Sports Hub</h1>

    <nav>
        <a href="index.html">Home</a>
        <a href="aupl live.html">Live</a>
        <a href="news.html">News</a>
        <a href="aupl-fixtures.html">Fixtures</a>
        <a href="results.html">Results</a>
        <a href="aupltables.html">Tables</a>
        <a href="aupl clubs.html">Clubs</a>
        <a href="players.html">Players</a>
        <a href="aupl fantasy.html">Fantasy</a>
    </nav>

</header>


<main class="register-page">

    <section class="register-container">

        <div class="register-header">

            <p>SCHOOL SPORTS HUB</p>

            <h2>Create Account</h2>

            <span>
                Choose your account type
            </span>

        </div>


        <!-- ACCOUNT TYPES -->

        <div class="account-types">

            <button
                type="button"
                class="account-type"
                data-type="player"
            >
                <span class="account-icon">👤</span>

                <strong>Player</strong>

                <small>
                    League participant
                </small>
            </button>


            <button
                type="button"
                class="account-type"
                data-type="coach"
            >
                <span class="account-icon">🧑‍🏫</span>

                <strong>Coach</strong>

                <small>
                    Team coach
                </small>
            </button>


            <button
                type="button"
                class="account-type"
                data-type="fan"
            >
                <span class="account-icon">👥</span>

                <strong>Fan</strong>

                <small>
                    Follow the league
                </small>
            </button>

        </div>


        <div
            class="selected-account"
            id="registerSelectedAccount"
        >
            Select an account type above
        </div>


        <!-- REGISTRATION FORM -->

        <form id="registerForm">

            <input
                type="hidden"
                id="registerAccountType"
            >


            <div class="form-group">

                <label for="registerName">
                    Full Name
                </label>

                <input
                    type="text"
                    id="registerName"
                    placeholder="Enter your full name"
                    required
                >

            </div>


            <div class="form-group">

                <label for="registerEmail">
                    Email Address
                </label>

                <input
                    type="email"
                    id="registerEmail"
                    placeholder="Enter your email"
                    required
                >

            </div>


            <div class="form-group">

                <label for="registerPassword">
                    Password
                </label>

                <input
                    type="password"
                    id="registerPassword"
                    placeholder="Create a password"
                    required
                >

            </div>


            <div class="form-group">

                <label for="confirmPassword">
                    Confirm Password
                </label>

                <input
                    type="password"
                    id="confirmPassword"
                    placeholder="Confirm your password"
                    required
                >

            </div>


            <button
                type="submit"
                class="register-button"
            >
                Create Account
            </button>

        </form>


        <div
            id="registerMessage"
            class="register-message"
        ></div>


        <div class="register-footer">

            <p>
                Already have an account?
            </p>

            <a href="login.html">
                Login
            </a>

        </div>

    </section>

</main>


<script src="aupl.js"></script>

</body>

</html>
